name: agentmesh

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmesh-local-only}
    volumes:
      - agentmesh-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  agentmesh:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://agentmesh:${POSTGRES_PASSWORD:-agentmesh-local-only}@postgres:5432/agentmesh
      AGENT_SESSION_SIGNING_KEY: ${AGENT_SESSION_SIGNING_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      AGENTMESH_ADMIN_TOKEN: ${AGENTMESH_ADMIN_TOKEN:-}
      AGENTMESH_ADMIN_COOKIE_SECURE: ${AGENTMESH_ADMIN_COOKIE_SECURE:-0}
      AGENTMESH_DB_OBSERVER_PASSWORD: ${AGENTMESH_DB_OBSERVER_PASSWORD:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      AGENTMESH_PUBLIC_ORIGIN: ${AGENTMESH_PUBLIC_ORIGIN:-}
      AGENTMESH_WEB_AUTH_KEY: ${AGENTMESH_WEB_AUTH_KEY:-}
      AGENTMESH_OPERATOR_GITHUB_IDS: ${AGENTMESH_OPERATOR_GITHUB_IDS:-}
      AGENTMESH_PROJECT_LIMIT: ${AGENTMESH_PROJECT_LIMIT:-}
      AGENTMESH_TOKEN_TTL_DAYS: ${AGENTMESH_TOKEN_TTL_DAYS:-}
      AGENTMESH_RATE_LIMIT_OAUTH_START: ${AGENTMESH_RATE_LIMIT_OAUTH_START:-20}
      AGENTMESH_RATE_LIMIT_OWNER_READ: ${AGENTMESH_RATE_LIMIT_OWNER_READ:-300}
      AGENTMESH_RATE_LIMIT_OWNER_MUTATION: ${AGENTMESH_RATE_LIMIT_OWNER_MUTATION:-60}
      AGENTMESH_RATE_LIMIT_CONNECTION_CREATE: ${AGENTMESH_RATE_LIMIT_CONNECTION_CREATE:-10}
      AGENTMESH_RATE_LIMIT_MCP: ${AGENTMESH_RATE_LIMIT_MCP:-600}
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - 127.0.0.1:${AGENTMESH_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  agentmesh-postgres:
