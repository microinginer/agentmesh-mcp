name: Bug report
description: Report reproducible incorrect behavior without sharing credentials.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste project tokens, OAuth secrets, database dumps, or user data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, pnpm, PostgreSQL, and client versions.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, and personal data.
          required: true
